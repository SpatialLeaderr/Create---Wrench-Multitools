# Sets default memory used for gradle commands. Can be overridden by user or command line properties.
org.gradle.jvmargs=-Xmx3G
org.gradle.daemon=false
org.gradle.parallel=true
org.gradle.caching=true

#read more on this at https://github.com/neoforged/ModDevGradle?tab=readme-ov-file#better-minecraft-parameter-names
# Parchment is an unofficial project that adds parameter names and javadocs on top of official mappings.
# Using this makes Minecraft code readable in your IDE.
parchment_minecraft_version=1.21.1
parchment_mappings_version=2024.11.17

# Minecraft
minecraft_version=1.21.1
minecraft_version_range=[1.21.1, 1.21.2)

# NeoForge
neo_version=21.1.227
neo_version_range=[21.1.0,)
loader_version_range=[4,)

# Create mod dependency (from https://wiki.createmod.net/developers/depend-on-create/neoforge-1.21.1)
create_version=6.0.10-281
create_version_range=[6.0,)
ponder_version=1.0.82
flywheel_version=1.0.6
registrate_version=MC1.21-1.3.0+67

# Mod Properties
mod_id=createwrenchmultitools
mod_name=Create: Wrench Multitools
mod_license=MIT
mod_version=0.1.0
mod_group_id=nz.gks.wrenchmultitools
mod_authors=SpatialLeader
mod_description=Adds enchantable multi-tier wrenches to Create mod. Works like a Create wrench but can also mine any block and has no durability.
